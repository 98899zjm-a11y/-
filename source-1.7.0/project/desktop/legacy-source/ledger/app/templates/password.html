{% extends "base.html" %}
{% block title %}改密码{% endblock %}
{% block body %}
<div class="card" style="max-width:520px">
  <h2>改密码</h2>
  <div class="card-body">
    {% if u.must_change_pw %}
      <div class="tip">这是初始密码，先改成你自己的。</div>
    {% endif %}
    <form method="post">
      <div class="field"><label>现在的密码</label><input type="password" name="old" autofocus></div>
      <div class="field"><label>新密码（至少 6 位）</label><input type="password" name="new"></div>
      <div class="field"><label>再输一遍新密码</label><input type="password" name="again"></div>
      <button class="btn primary" type="submit">保存</button>
    </form>
  </div>
</div>
{% endblock %}
