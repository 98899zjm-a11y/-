{% extends "base.html" %}
{% block title %}修改密码{% endblock %}

{% block body %}
<div class="page-head">
  <div>
    <h1>修改密码</h1>
    <div class="sub">当前账号：{{ cu.username }}{% if cu.display_name %}（{{ cu.display_name }}）{% endif %}</div>
  </div>
</div>

{% if forced %}
<div class="note warn">
  <b>这是初始密码，请先改掉再使用。</b><br>
  不改也能用，但同一局域网内知道初始密码的人都能改你的盘点数据。
</div>
{% endif %}

<div class="card" style="max-width:440px">
  <div class="card-body">
    <form method="post" autocomplete="off">
      <div class="field">
        <label for="old">当前密码</label>
        <input type="password" id="old" name="old" autocomplete="current-password" autofocus>
      </div>
      <div class="field">
        <label for="new">新密码</label>
        <input type="password" id="new" name="new" autocomplete="new-password">
        <div class="tip">至少 6 位。别用 123456 这类，这台机器局域网内谁都能访问。</div>
      </div>
      <div class="field">
        <label for="new2">再输一次新密码</label>
        <input type="password" id="new2" name="new2" autocomplete="new-password">
      </div>
      <button class="btn primary" type="submit">保存新密码</button>
      <a class="btn ghost" href="{{ url_for('home.index') }}">取消</a>
    </form>
  </div>
</div>
{% endblock %}
