{% extends "base.html" %}
{% block title %}{{ code }} {{ title }}{% endblock %}

{% block body %}
<div class="card" style="max-width:760px;margin:40px auto">
  <div class="card-body">
    <div style="font-size:44px;font-weight:700;color:#ccd4de;line-height:1">{{ code }}</div>
    <h1 style="font-size:19px;margin:6px 0 10px">{{ title }}</h1>
    <p style="color:var(--ink-2);margin:0 0 16px">{{ msg }}</p>

    {% if detail %}
      <pre class="mono" style="background:#f7f9fc;border:1px solid #eef1f5;border-radius:6px;padding:12px;overflow:auto;font-size:12.5px;color:var(--ink-2);max-height:320px">{{ detail }}</pre>
    {% endif %}

    <div style="margin-top:18px;display:flex;gap:8px">
      <a class="btn primary" href="{{ url_for('home.index') }}">回到首页</a>
      <a class="btn" href="javascript:history.back()">返回上一页</a>
    </div>
  </div>
</div>
{% endblock %}
