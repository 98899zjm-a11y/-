<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收付交接 · 鑫金源</title><link rel="stylesheet" href="/standalone/workbench.css"><script src="/standalone/bridge.js"></script><script src="/standalone/source-releases.js" defer></script></head><body><main class="dashboard"><header class="page-head"><div><p class="section-caption">财务 ERP</p><h1>把收付依据交给出纳</h1><p class="muted">仅发布已审核的应收应付，不直接收付款。撤回只限制未来处理，历史记录仍保留。</p></div><a class="quiet" href="/erp/">返回 ERP</a></header><div class="isolation-note">独立开发账套。出纳须选择本人获授权的资金账户，再读取财务发布的来源。</div><section class="module"><form id="release-form"><label for="bill">已审核往来单据</label><select id="bill" style="width:100%;padding:12px;margin:12px 0 20px" required><option value="">正在读取</option></select><label for="release-note">交接说明 / 撤回原因</label><input id="release-note" maxlength="500" required style="width:100%;padding:12px;margin:12px 0 20px" placeholder="请填写已核对的收付依据"><button class="primary" type="submit">发布给出纳</button></form><p id="release-status" role="status" style="margin-top:18px"></p></section><section class="workflow"><h2>交接记录</h2><div style="overflow:auto"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>单号</th><th>往来单位</th><th>状态</th><th>操作</th></tr></thead><tbody id="release-rows"></tbody></table></div></section></main></body></html>
