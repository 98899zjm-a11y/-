<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 鑫金源独立业务工作台</title><link rel="stylesheet" href="/standalone/workbench.css"><script defer src="/standalone/login.js"></script></head>
<body class="login-page"><main class="login-layout"><section class="brand-panel"><span class="brand-mark" aria-hidden="true">◇</span><p class="brand-name">鑫金源</p><h1>让每一笔往来<br>都有据可查。</h1><p>采购、收货、往来与资金，沿着单据走，按权限复核。</p><div class="environment">独立开发版 · 使用虚构测试数据</div></section><section class="login-panel"><form id="login-form"><p class="section-caption">业务工作台</p><h2>登录你的工作账户</h2><p class="muted">与销售正式版账号、数据分开管理。</p><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="80"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button class="primary" type="submit">进入工作台</button><p id="login-notice" role="alert" class="error" hidden></p><p class="login-foot">测试账号由独立启动工具生成。请向管理员获取，不使用正式员工账号。</p></form></section></main></body></html>
